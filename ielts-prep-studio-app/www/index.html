<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IELTS Prep Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
/* ============================================================
   Student app — Practice Tests + Lessons.
   No "submit to teacher" feature: Finish & Submit stays purely
   local (score + review), matching an offline self-study tool.
   ============================================================ */

let state = {
  tests: [],
  lessons: [],
  homeTab: 'tests',
  activeTestId: null,
  activeLessonId: null,
  activeSection: 'listening',
  studentAnswers: {},
  timers: {},
  page: { listening:0, reading:0, writing:0, speaking:0 },
  checkedSections: {},
  showResults: false,
  revealedTips: {},
};
let timerInterval = null;

/* ---------- content auto-update ----------
   Once you have a GitHub repo, export your latest content from
   admin.html and commit that JSON file to this repo at a known path
   (e.g. content/latest.json), then point this at its raw file URL:
     https://raw.githubusercontent.com/<you>/<repo>/main/content/latest.json
   Students then get new tests/lessons automatically whenever they
   open the app with internet — no "Import update" tap needed. Until
   this is filled in, the check just quietly does nothing. */
const CONTENT_UPDATE_URL = 'https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/content/latest.json';

function getTest(id){ return state.tests.find(t=>t.id===id); }
function getLesson(id){ return state.lessons.find(l=>l.id===id); }

async function init(){
  try{
    state.tests = await getAllTests();
    if(state.tests.length === 0){
      const seed = seedTest();
      state.tests = [seed];
      await saveTestRecord(seed);
    }
    state.lessons = await getAllLessons();
    render();

    // Quiet background check — never blocks the screen above, and does
    // nothing at all if offline or the URL hasn't been configured yet.
    checkForContentUpdate(CONTENT_UPDATE_URL).then(async (counts) => {
      if(counts){
        state.tests = await getAllTests();
        state.lessons = await getAllLessons();
        // Don't yank the screen out from under someone mid-test — only
        // refresh the view if they're still sitting on the home screen.
        if(!state.activeTestId && !state.activeLessonId){
          render();
        }
        showToast('New content downloaded');
      }
    });
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = renderHeader() + `<div class="empty-state"><h3>Couldn't load the app</h3><p>${escapeHtml(err && err.message || String(err))}</p></div>`;
  }
}

function render(){
  document.getElementById('app').innerHTML = renderHeader() + renderStorageBanner() + renderStudent();
}

function renderHeader(){
  return `
  <div class="app-header" style="flex-wrap:wrap; row-gap:10px;">
    <div class="brand">
      <span class="brand-mark">IE</span>
      <div><h1>IELTS Prep Studio</h1></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <label class="btn btn-ghost btn-sm" style="cursor:pointer; color:var(--ink-soft);">Import update<input type="file" accept="application/json" style="display:none;" onchange="importUpdate(this)"></label>
    </div>
  </div>`;
}

function importUpdate(input){
  importDataFile(input, async (counts, err) => {
    if(err){
      console.error(err);
      alert('Could not import this update: ' + (err && err.message || err));
      return;
    }
    state.tests = await getAllTests();
    state.lessons = await getAllLessons();
    render();
    showToast(counts.anyFailed
      ? `Updated: ${counts.tests} test(s), ${counts.lessons} lesson(s) — some items only saved to memory (storage unavailable)`
      : `Updated: ${counts.tests} test(s), ${counts.lessons} lesson(s)`);
  });
}

function renderStorageBanner(){
  if(isStorageAvailable()) return '';
  return `<div class="storage-warning">On-device storage isn't working in this browser/page context, so anything you do here won't be saved after a refresh. This usually happens when the file is opened directly (double-clicked) instead of served — try running a local server, or hosting the files, for it to persist properly.</div>`;
}

function renderStudent(){
  if(state.activeLessonId) return renderLessonView();
  if(!state.activeTestId) return renderStudentHome();
  const test = getTest(state.activeTestId);
  if(!test){ state.activeTestId = null; return renderStudentHome(); }
  return state.showResults ? renderResults(test) : renderRunner(test);
}

function setHomeTab(tab){
  state.homeTab = tab;
  render();
}

function renderStudentHome(){
  const tabs = `
    <div class="home-tab-bar">
      <button class="${state.homeTab==='tests'?'active':''}" onclick="setHomeTab('tests')">Practice Tests</button>
      <button class="${state.homeTab==='lessons'?'active':''}" onclick="setHomeTab('lessons')">Lessons</button>
    </div>
  `;
  return tabs + (state.homeTab === 'tests' ? renderTestsHome() : renderLessonsHome());
}

function renderTestsHome(){
  if(state.tests.length === 0){
    return `<div class="empty-state"><h3>No tests yet</h3><p>Ask your teacher to add one in Admin.</p></div>`;
  }
  const cards = state.tests.map(t => `
    <div class="card test-card">
      <div>
        <h3>${escapeHtml(t.title)}</h3>
        <p>${escapeHtml(t.description || '')}</p>
        <div class="meta-row">
          <span>${t.listening.sections.length} listening sections</span>
          <span>${t.reading.questions.length} reading Qs</span>
          <span>${t.writing.tasks.length} writing tasks</span>
          <span>${t.speaking.parts.length} speaking parts</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="startTest('${t.id}')">Start test</button>
      </div>
    </div>
  `).join('');
  return `
    <h2 class="section-title">Practice tests</h2>
    <p class="section-sub">Pick a test to begin. Each section is timed, just like the real exam.</p>
    ${cards}
  `;
}

function renderLessonsHome(){
  if(state.lessons.length === 0){
    return `<div class="empty-state"><h3>No lessons yet</h3><p>Ask your teacher to upload one in Admin.</p></div>`;
  }
  const cards = state.lessons.map(l => {
    const cached = mediaUrlCache[l.id];
    if(cached === undefined){
      ensureMediaLoaded(l.id, ()=>{ if(state.homeTab === 'lessons' && !state.activeLessonId) render(); });
    }
    const hasPdf = cached && cached !== false;
    return `
      <div class="card lesson-card">
        <div>
          <h3>${escapeHtml(l.title)}</h3>
          ${hasPdf ? '' : '<p style="margin:0; font-size:13px; color:var(--ink-soft);">No file uploaded yet</p>'}
        </div>
        <div class="actions">${hasPdf ? `<button class="btn btn-primary" onclick="openLesson('${l.id}')">Open PDF</button>` : ''}</div>
      </div>
    `;
  }).join('');
  return `
    <h2 class="section-title">Lessons</h2>
    <p class="section-sub">PDF notes and guides from your teacher — no timer, read at your own pace.</p>
    ${cards}
  `;
}

function openLesson(id){ state.activeLessonId = id; render(); }
function closeLesson(){ state.activeLessonId = null; render(); }

function renderLessonView(){
  const lesson = getLesson(state.activeLessonId);
  if(!lesson){ state.activeLessonId = null; return renderStudentHome(); }
  const cached = mediaUrlCache[lesson.id];
  if(cached === undefined){
    ensureMediaLoaded(lesson.id, ()=>{ if(state.activeLessonId === lesson.id) render(); });
  }
  let viewer;
  if(cached && cached !== false){
    // TODO(pdf-viewer): this <iframe> leans on the browser's built-in PDF
    // renderer, which works fine in a normal desktop/mobile browser (which
    // is all we're testing in right now) but is NOT reliable inside an
    // Android WebView, which is what the packaged APK will actually use.
    // Before shipping the APK, replace this with either (a) a plain
    // "open PDF" link/handoff to the device's PDF viewer instead of inline
    // display, or (b) a bundled pdf.js renderer for a real in-app reading
    // experience. Revisit then — not needed for the browser prototype.
    viewer = `<iframe src="${cached}" style="width:100%; height:75vh; border:1px solid var(--border); border-radius:10px;"></iframe>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:10px;">If the PDF doesn't display above, <a href="${cached}" target="_blank">open it in a new tab</a> instead.</p>`;
  } else if(cached === false){
    viewer = `<div class="empty-state"><h3>No PDF uploaded for this lesson yet</h3></div>`;
  } else {
    viewer = `<div class="empty-state"><h3>Loading…</h3></div>`;
  }
  return `
    <h2 class="section-title">${escapeHtml(lesson.title)}</h2>
    ${viewer}
    <div class="runner-footer"><button class="btn btn-primary" onclick="closeLesson()">Back to lessons</button></div>
  `;
}

function startTest(id){
  state.activeTestId = id;
  state.activeSection = 'listening';
  state.studentAnswers = {};
  state.showResults = false;
  state.checkedSections = {};
  state.revealedTips = {};
  state.page = { listening:0, reading:0, writing:0, speaking:0 };
  state.timers = {
    listening: SECTION_META.listening.time,
    reading: SECTION_META.reading.time,
    writing: SECTION_META.writing.time,
    speaking: SECTION_META.speaking.time,
  };
  render();
  startTimer();
}

function goHome(){
  stopTimer();
  state.activeTestId = null;
  state.showResults = false;
  render();
}

function startTimer(){
  stopTimer();
  timerInterval = setInterval(()=>{
    const sec = state.activeSection;
    if(state.timers[sec] > 0){
      state.timers[sec] -= 1;
      const el = document.getElementById('timer-display');
      if(el){
        el.textContent = fmtTime(state.timers[sec]);
        el.classList.toggle('low', state.timers[sec] <= 60);
      }
    }
  }, 1000);
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function setSection(sec){
  state.activeSection = sec;
  render();
}

function toggleCheck(key, val){
  state.checkedSections[key] = val;
  render();
}
function renderCheckBar(checkKey, questions, answers){
  const checked = !!state.checkedSections[checkKey];
  if(!checked){
    return `<div class="check-bar"><button class="btn btn-primary btn-sm" onclick="toggleCheck('${checkKey}', true)">Check answers</button><span></span></div>`;
  }
  const res = scoreSection(questions, answers);
  return `<div class="card check-bar"><span>Score: <strong>${res.correct}/${res.total}</strong></span><button class="btn btn-sm" onclick="toggleCheck('${checkKey}', false)">Try again</button></div>`;
}

function changePage(section, delta, total){
  state.page[section] = Math.min(total - 1, Math.max(0, state.page[section] + delta));
  render();
}
function renderPager(section, page, total, label){
  if(total <= 1) return '';
  return `
    <div class="pager">
      <button class="btn btn-sm arrow" ${page<=0?'disabled':''} onclick="changePage('${section}', -1, ${total})">← Prev</button>
      <span class="page-info">${label} ${page+1} of ${total}</span>
      <button class="btn btn-sm arrow" ${page>=total-1?'disabled':''} onclick="changePage('${section}', 1, ${total})">Next →</button>
    </div>
  `;
}
function renderInstructions(text){
  if(!text || !text.trim()) return '';
  return `<div class="instructions-box">${renderMarkdownLite(text)}</div>`;
}

function renderRunner(test){
  const tabs = SECTION_ORDER.map(sec => `
    <button class="${state.activeSection===sec?'active':''}" onclick="setSection('${sec}')">${SECTION_META[sec].label}</button>
  `).join('');

  let body = '';
  if(state.activeSection === 'listening') body = renderListeningSection(test);
  else if(state.activeSection === 'reading') body = renderReadingSection(test);
  else if(state.activeSection === 'writing') body = renderWritingSection(test);
  else body = renderSpeakingSection(test);

  return `
    <div class="runner-head">
      <div>
        <h2 class="section-title">${escapeHtml(test.title)}</h2>
        <p class="section-sub" style="margin-bottom:0;">${SECTION_META[state.activeSection].label} section</p>
      </div>
      <div class="timer ${state.timers[state.activeSection] <= 60 ? 'low':''}" id="timer-display">${fmtTime(state.timers[state.activeSection])}</div>
    </div>
    <div class="tab-bar">${tabs}</div>
    ${body}
    <div class="runner-footer">
      <button class="btn btn-ghost" onclick="goHome()" style="margin-right:auto;">Exit</button>
      <button class="btn btn-primary" onclick="finishTest()">Finish &amp; submit</button>
    </div>
  `;
}

function renderListeningSection(test){
  const sections = test.listening.sections;
  const page = Math.min(state.page.listening, Math.max(0, sections.length-1));
  state.page.listening = page;
  const current = sections[page];
  if(!current) return '<div class="empty-state"><h3>No listening sections yet</h3></div>';

  const cached = audioUrlCache[current.id];
  if(cached === undefined){
    ensureAudioLoaded(current.id, ()=>{
      if(state.activeTestId === test.id && state.activeSection === 'listening') render();
    });
  }
  let audioHtml;
  if(cached && cached !== false){
    audioHtml = `<audio controls src="${cached}"></audio>`;
  } else if(cached === false){
    audioHtml = `<div class="no-audio">No audio uploaded for this section yet. Ask your teacher to add it in Admin — you can still answer from the prompts below.</div>`;
  } else {
    audioHtml = `<div class="no-audio">Loading audio…</div>`;
  }

  const flatQs = sections.flatMap(s=>s.questions);
  const numMap = numberingMap(flatQs);
  const qHtml = current.questions.length
    ? current.questions.map(q=>renderQuestion(q, numMap, !!state.checkedSections['listening-'+current.id])).join('')
    : '<div class="empty-state"><h3>No questions in this section yet</h3></div>';

  return `
    <div class="audio-note">Section ${current.sectionNumber} — ${escapeHtml(current.audioNote || '')}</div>
    ${audioHtml}
    ${renderInstructions(current.instructions)}
    ${qHtml}
    ${current.questions.length ? renderCheckBar('listening-'+current.id, current.questions, state.studentAnswers) : ''}
    ${renderPager('listening', page, sections.length, 'Section')}
  `;
}

function renderReadingSection(test){
  const allQs = test.reading.questions;
  const pages = buildPages(allQs, QUESTIONS_PER_PAGE);
  const page = Math.min(state.page.reading, pages.length-1);
  state.page.reading = page;
  const pageQs = pages[page];
  const numMap = numberingMap(allQs);
  const checked = !!state.checkedSections['reading'];
  const qHtml = pageQs.length
    ? pageQs.map(q=>renderQuestion(q, numMap, checked)).join('')
    : '<div class="empty-state"><h3>No questions yet</h3></div>';

  return `
    <div class="passage">${renderMarkdownLite(test.reading.passage)}</div>
    ${renderInstructions(test.reading.instructions)}
    ${qHtml}
    ${allQs.length ? renderCheckBar('reading', allQs, state.studentAnswers) : ''}
    ${renderPager('reading', page, pages.length, 'Page')}
  `;
}

function renderQuestion(q, numMap, checked){
  const startNum = numMap[q.id];
  if(q.type === 'form_completion') return renderFormCompletion(q, startNum, checked);

  const given = state.studentAnswers[q.id];
  let control = '';
  if(q.type === 'mcq'){
    control = `<div class="q-options">${q.options.map((opt,oi)=>`
      <label><input type="radio" name="${q.id}" value="${oi}" ${given==oi?'checked':''} ${checked?'disabled':''} onchange="setAnswer('${q.id}', this.value)"> ${escapeHtml(opt)}</label>
    `).join('')}</div>`;
  } else if(q.type === 'multi_select'){
    const givenArr = (given||'').split(',').filter(Boolean).map(Number);
    control = `<div class="q-options">${q.options.map((opt,oi)=>`
      <label><input type="checkbox" value="${oi}" ${givenArr.includes(oi)?'checked':''} ${checked?'disabled':''} onchange="toggleMultiSelect('${q.id}', ${oi}, this.checked)"> ${escapeHtml(opt)}</label>
    `).join('')}</div>`;
  } else if(q.type === 'fill_blank'){
    control = `<div class="q-fill"><input type="text" placeholder="Type your answer" value="${escapeAttr(given||'')}" ${checked?'disabled':''} oninput="setAnswer('${q.id}', this.value)"></div>`;
  } else {
    control = `<div class="q-tfng"><select ${checked?'disabled':''} onchange="setAnswer('${q.id}', this.value)">
      <option value="" ${!given?'selected':''}>Choose an answer</option>
      <option value="True" ${given==='True'?'selected':''}>True</option>
      <option value="False" ${given==='False'?'selected':''}>False</option>
      <option value="Not Given" ${given==='Not Given'?'selected':''}>Not Given</option>
    </select></div>`;
  }

  let feedback = '';
  if(checked){
    const ok = isQuestionCorrect(q, given);
    let correctLabel;
    if(q.type==='mcq') correctLabel = q.options[q.correct];
    else if(q.type==='multi_select') correctLabel = q.correct.map(i=>q.options[i]).join(', ');
    else correctLabel = q.correct;
    feedback = `<div class="inline-feedback ${ok?'correct':'wrong'}">${ok?'✓ Correct':'✕ Correct answer: '+escapeHtml(String(correctLabel))}</div>`;
  }

  return `
    <div class="q-block">
      <div class="q-prompt"><span class="qnum">${startNum}</span><span>${escapeHtml(q.prompt)}</span></div>
      ${control}
      ${feedback}
    </div>
  `;
}

function renderFormCompletion(q, startNum, checked){
  const lines = q.template.split('\n').map(line => line.replace(/\{(\d+)\}/g, (m, numStr) => {
    const localN = Number(numStr);
    const globalNum = startNum + localN - 1;
    const key = q.id + '-' + localN;
    const given = state.studentAnswers[key] || '';
    const blank = q.blanks.find(b=>b.n === localN);
    let fb = '';
    if(checked && blank){
      const ok = given.trim().toLowerCase() === String(blank.correct).trim().toLowerCase();
      fb = ok ? ` <span class="inline-feedback correct" style="display:inline;">✓</span>` : ` <span class="inline-feedback wrong" style="display:inline;">(answer: ${escapeHtml(String(blank.correct))})</span>`;
    }
    return `<span class="qnum" style="margin-right:4px;">${globalNum}</span><input type="text" value="${escapeAttr(given)}" ${checked?'disabled':''} oninput="setBlankAnswer('${q.id}',${localN}, this.value)">${fb}`;
  }));
  return `
    <div class="q-block">
      <div class="q-prompt" style="margin-bottom:8px;"><span>${escapeHtml(q.prompt)}</span></div>
      <div class="form-lines">${lines.map(l=>`<div class="form-line">${l}</div>`).join('')}</div>
    </div>
  `;
}

function setAnswer(qid, val){ state.studentAnswers[qid] = val; }
function setBlankAnswer(qid, n, val){ state.studentAnswers[qid+'-'+n] = val; }
function toggleMultiSelect(qid, idx, isChecked){
  let arr = (state.studentAnswers[qid]||'').split(',').filter(Boolean).map(Number);
  if(isChecked){ if(!arr.includes(idx)) arr.push(idx); }
  else { arr = arr.filter(i=>i!==idx); }
  state.studentAnswers[qid] = arr.sort((a,b)=>a-b).join(',');
}

function renderWritingSection(test){
  const tasks = test.writing.tasks;
  if(tasks.length === 0) return '<div class="empty-state"><h3>No writing tasks yet</h3></div>';
  const page = Math.min(state.page.writing, tasks.length - 1);
  state.page.writing = page;
  const task = tasks[page];
  const val = state.studentAnswers[task.id] || '';
  const wc = wordCount(val);

  const cached = mediaUrlCache[task.id];
  if(cached === undefined){
    ensureMediaLoaded(task.id, ()=>{
      if(state.activeTestId === test.id && state.activeSection === 'writing') render();
    });
  }
  const imageHtml = (cached && cached !== false) ? `<img class="task-image" src="${cached}">` : '';

  return `
    <div class="task-block">
      <div class="task-label">Task ${task.taskNumber} · minimum ${task.minWords} words</div>
      ${renderInstructions(task.instructions)}
      <div class="task-prompt">${escapeHtml(task.prompt)}</div>
      ${imageHtml}
      <textarea class="writing-area" placeholder="Write your response here..." oninput="setWritingAnswer('${task.id}', this)">${escapeHtml(val)}</textarea>
      <div class="word-count ${wc>=task.minWords?'ok':''}" id="wc-${task.id}">${wc} words</div>
    </div>
    ${renderPager('writing', page, tasks.length, 'Task')}
  `;
}

function setWritingAnswer(tid, el){
  state.studentAnswers[tid] = el.value;
  const wc = wordCount(el.value);
  const task = state.tests.flatMap(t=>t.writing.tasks).find(t=>t.id===tid);
  const counter = document.getElementById('wc-'+tid);
  if(counter && task){
    counter.textContent = wc + ' words';
    counter.classList.toggle('ok', wc >= task.minWords);
  }
}

function toggleTip(qid){
  state.revealedTips[qid] = !state.revealedTips[qid];
  render();
}

function renderSpeakingSection(test){
  const parts = test.speaking.parts;
  if(parts.length === 0) return '<div class="empty-state"><h3>No speaking parts yet</h3></div>';
  const page = Math.min(state.page.speaking, parts.length - 1);
  state.page.speaking = page;
  const part = parts[page];
  const val = state.studentAnswers[part.id] || '';
  const qItems = part.questions.map(q => {
    const revealed = !!state.revealedTips[q.id];
    const tip = q.tip && q.tip.trim()
      ? `<button class="btn btn-ghost btn-sm tip-toggle" onclick="toggleTip('${q.id}')">${revealed?'Hide tip':'Show tip'}</button>${revealed?`<div class="tip-box">${escapeHtml(q.tip)}</div>`:''}`
      : '';
    return `<li>${escapeHtml(q.text)}${tip}</li>`;
  }).join('');
  return `
    <div class="speak-part">
      <h4>Part ${part.partNumber} — ${escapeHtml(part.title)}</h4>
      ${renderInstructions(part.instructions)}
      <ul>${qItems}</ul>
      <div class="prep-note">Practice mode: jot notes for what you'd say out loud (no recording in this prototype)</div>
      <textarea class="writing-area" style="min-height:120px;" placeholder="Notes for your spoken answer..." oninput="setAnswer('${part.id}', this.value)">${escapeHtml(val)}</textarea>
    </div>
    ${renderPager('speaking', page, parts.length, 'Part')}
  `;
}

function finishTest(){
  stopTimer();
  state.showResults = true;
  render();
}

function renderResults(test){
  const flatListening = test.listening.sections.flatMap(s=>s.questions);
  const lRes = scoreSection(flatListening, state.studentAnswers);
  const rRes = scoreSection(test.reading.questions, state.studentAnswers);
  const lNumMap = numberingMap(flatListening);
  const rNumMap = numberingMap(test.reading.questions);

  const writingBlock = test.writing.tasks.map(t => {
    const val = state.studentAnswers[t.id] || '';
    return `<div class="review-row"><span class="mark">—</span><span><strong>Task ${t.taskNumber}</strong> · ${wordCount(val)} words${val ? '' : ' (left blank)'}</span></div>`;
  }).join('');

  const speakingBlock = test.speaking.parts.map(p => {
    const val = state.studentAnswers[p.id] || '';
    return `<div class="review-row"><span class="mark">—</span><span><strong>Part ${p.partNumber}</strong> · ${val ? 'notes taken' : 'no notes left'}</span></div>`;
  }).join('');

  return `
    <h2 class="section-title">Results — ${escapeHtml(test.title)}</h2>
    <p class="section-sub">Listening and reading are auto-graded. Writing and speaking are for your own review.</p>
    <div class="score-banner">
      <div class="score-item"><div class="num">${lRes.correct}/${lRes.total}</div><div class="label">Listening</div></div>
      <div class="score-item"><div class="num">${rRes.correct}/${rRes.total}</div><div class="label">Reading</div></div>
    </div>
    <div class="card">
      <h3 style="font-family:var(--serif); font-size:17px; margin:0 0 4px;">Listening — ${lRes.correct}/${lRes.total}</h3>
      ${reviewRowsHtml(flatListening, lNumMap, state.studentAnswers)}
      <h3 style="font-family:var(--serif); font-size:17px; margin:24px 0 4px;">Reading — ${rRes.correct}/${rRes.total}</h3>
      ${reviewRowsHtml(test.reading.questions, rNumMap, state.studentAnswers)}
      <h3 style="font-family:var(--serif); font-size:17px; margin:24px 0 4px;">Writing</h3>
      ${writingBlock}
      <h3 style="font-family:var(--serif); font-size:17px; margin:24px 0 4px;">Speaking</h3>
      ${speakingBlock}
    </div>
    <div class="runner-footer">
      <button class="btn btn-primary" onclick="goHome()">Back to tests</button>
    </div>
  `;
}

init();
</script>
</body>
</html>
