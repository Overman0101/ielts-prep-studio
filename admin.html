<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IELTS Prep Studio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
/* ============================================================
   Admin/authoring tool — teacher-only. Keep OUT of the APK build.
   Shares the same on-device IndexedDB as index.html (data.js).
   ============================================================ */

const QUESTION_TYPE_LABELS = {
  mcq: 'Multiple choice',
  fill_blank: 'Fill in the blank',
  tfng: 'True / False / Not Given',
  multi_select: 'Multi-select',
  form_completion: 'Form completion',
};

let state = {
  tests: [],
  lessons: [],
  adminSection: 'tests', // 'tests' | 'lessons'
  editingTestId: null,
  adminTab: 'info',
  defaultQType: {}, // locationKey -> last-used question type, remembered per section this session
};
let debounceTimers = {};

function getTest(id){ return state.tests.find(t=>t.id===id); }
function getLesson(id){ return state.lessons.find(l=>l.id===id); }

async function init(){
  try{
    state.tests = await getAllTests();
    if(state.tests.length === 0){
      const seed = seedTest();
      state.tests = [seed];
      await saveTestRecord(seed);
    }
    state.lessons = await getAllLessons();
    render();
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = renderHeader() + `<div class="empty-state"><h3>Couldn't load the app</h3><p>${escapeHtml(err && err.message || String(err))}</p></div>`;
  }
}

function render(){
  document.getElementById('app').innerHTML = renderHeader() + renderStorageBanner() + renderAdmin();
}

function renderHeader(){
  return `
  <div class="app-header" style="flex-wrap:wrap; row-gap:10px;">
    <div class="brand">
      <span class="brand-mark">IE</span>
      <div><h1>IELTS Prep Studio — Admin</h1></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="exportAllData()">Export all data</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">Import data<input type="file" accept="application/json" style="display:none;" onchange="importData(this)"></label>
      <a href="index.html" class="btn btn-ghost btn-sm" style="text-decoration:none;">Student view →</a>
    </div>
  </div>`;
}

/* ============================================================
   Export / Import — bundles every test, lesson, and their audio/
   image/PDF blobs into one JSON file. This is the bridge between
   "what I authored here" and "what ships in the packaged app" —
   it's also just a backup, since everything otherwise only lives
   in this browser's IndexedDB.
   ============================================================ */
async function exportAllData(){
  showToast('Preparing export…');
  try{
    const audio = [];
    const media = [];
    for(const t of state.tests){
      for(const s of t.listening.sections){
        const blob = await getAudioBlob(s.id);
        if(blob) audio.push({ ownerId: s.id, base64: await blobToBase64(blob) });
      }
      for(const task of t.writing.tasks){
        const blob = await getMediaBlob(task.id);
        if(blob) media.push({ ownerId: task.id, base64: await blobToBase64(blob) });
      }
    }
    for(const l of state.lessons){
      const blob = await getMediaBlob(l.id);
      if(blob) media.push({ ownerId: l.id, base64: await blobToBase64(blob) });
    }

    const payload = {
      exportedAt: new Date().toISOString(),
      version: 1,
      tests: state.tests,
      lessons: state.lessons,
      audio,
      media,
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ielts-prep-studio-export-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Export downloaded');
  }catch(err){
    console.error(err);
    alert('Export failed: ' + (err && err.message || err));
  }
}

function importData(input){
  importDataFile(input, async (counts, err) => {
    if(err){
      console.error(err);
      alert('Could not import this file: ' + (err && err.message || err));
      return;
    }
    state.tests = await getAllTests();
    state.lessons = await getAllLessons();
    render();
    showToast(counts.anyFailed
      ? `Imported ${counts.tests} test(s), ${counts.lessons} lesson(s) — some items only saved to memory (storage unavailable)`
      : `Imported ${counts.tests} test(s), ${counts.lessons} lesson(s)`);
  });
}

function renderStorageBanner(){
  if(isStorageAvailable()) return '';
  return `<div class="storage-warning">On-device storage isn't working in this browser/page context, so anything you create here won't be saved after a refresh. This usually happens when the file is opened directly (double-clicked) instead of served — try running a local server, or hosting the files, for it to persist properly.</div>`;
}

function reportSaveResult(ok){ showToast(ok ? 'Saved' : 'Not saved — storage unavailable, working from memory only'); }

function persistTestNow(test){ saveTestRecord(test).then(reportSaveResult); }
function persistTestDebounced(test){
  clearTimeout(debounceTimers['t:'+test.id]);
  debounceTimers['t:'+test.id] = setTimeout(()=>{
    delete debounceTimers['t:'+test.id];
    saveTestRecord(test).then(reportSaveResult);
  }, 600);
}
function persistLessonNow(lesson){ saveLessonRecord(lesson).then(reportSaveResult); }
function persistLessonDebounced(lesson){
  clearTimeout(debounceTimers['l:'+lesson.id]);
  debounceTimers['l:'+lesson.id] = setTimeout(()=>{
    delete debounceTimers['l:'+lesson.id];
    saveLessonRecord(lesson).then(reportSaveResult);
  }, 600);
}

/* ============================================================
   Flush pending debounced saves before they'd otherwise be lost —
   e.g. a field edited less than 600ms before switching tabs, going
   back, or closing the page. A full save queue is overkill for a
   prototype; catching the two moments edits actually go missing
   (losing focus, and navigating) is enough.
   ============================================================ */
function flushPendingSave(key){
  clearTimeout(debounceTimers[key]);
  delete debounceTimers[key];
  if(key.startsWith('t:')){
    const t = getTest(key.slice(2));
    if(t) saveTestRecord(t).then(reportSaveResult);
  } else if(key.startsWith('l:')){
    const l = getLesson(key.slice(2));
    if(l) saveLessonRecord(l).then(reportSaveResult);
  }
}
function flushAllPendingSaves(){
  Object.keys(debounceTimers).forEach(flushPendingSave);
}
// Blur doesn't bubble, so this needs the capture phase to catch every
// field losing focus — covers "click a button while still in a field".
document.addEventListener('blur', flushAllPendingSaves, true);
// Best-effort catch for closing/refreshing the tab. Async storage writes
// aren't guaranteed to finish before unload, but this is strictly better
// than not trying, without building a full synchronous save queue.
window.addEventListener('beforeunload', flushAllPendingSaves);

/* ============================================================
   Top-level: Tests / Lessons switcher (shown at the home level)
   ============================================================ */
function renderAdmin(){
  if(state.editingTestId){
    const test = getTest(state.editingTestId);
    if(!test){ state.editingTestId = null; } else { return renderTestEditor(test); }
  }
  const tabs = `
    <div class="tab-bar">
      <button class="${state.adminSection==='tests'?'active':''}" onclick="setAdminSection('tests')">Tests</button>
      <button class="${state.adminSection==='lessons'?'active':''}" onclick="setAdminSection('lessons')">Lessons</button>
    </div>
  `;
  return tabs + (state.adminSection === 'tests' ? renderAdminHome() : renderAdminLessonsHome());
}

function setAdminSection(sec){
  flushAllPendingSaves();
  state.adminSection = sec;
  render();
}

/* ============================================================
   Tests home
   ============================================================ */
function renderAdminHome(){
  const rows = state.tests.map(t => `
    <div class="card test-card">
      <div>
        <h3>${escapeHtml(t.title)}</h3>
        <p>${escapeHtml(t.description || '')}</p>
      </div>
      <div class="actions">
        <button class="btn btn-sm" onclick="editTest('${t.id}')">Edit</button>
        <button class="btn btn-sm btn-alert" onclick="deleteTest('${t.id}')">Delete</button>
      </div>
    </div>
  `).join('');
  return `
    <h2 class="section-title">Manage tests</h2>
    <p class="section-sub">Create and edit full practice tests: listening, reading, writing and speaking.</p>
    <div style="margin-bottom:18px;"><button class="btn btn-primary" onclick="newTest()">+ New test</button></div>
    ${rows || '<div class="empty-state"><h3>No tests yet</h3><p>Create your first one above.</p></div>'}
  `;
}

function newTest(){
  const t = {
    id: uid(), title: 'Untitled test', description: '',
    listening: { sections: [ { id: uid(), sectionNumber:1, audioNote:'', instructions:'', questions:[] } ] },
    reading: { passage:'', instructions:'', questions:[] },
    writing: { tasks:[] },
    speaking: { parts:[] },
  };
  state.tests.push(t);
  state.editingTestId = t.id;
  state.adminTab = 'info';
  persistTestNow(t);
  render();
}

function editTest(id){
  flushAllPendingSaves();
  state.editingTestId = id;
  state.adminTab = 'info';
  render();
}

async function deleteTest(id){
  if(!confirm('Delete this test? This cannot be undone.')) return;
  const t = getTest(id);
  state.tests = state.tests.filter(t=>t.id!==id);
  render(); // reflect the removal immediately; cleanup below finishes in the background
  const results = [await deleteTestRecord(id)];
  if(t){
    for(const s of t.listening.sections){
      results.push(await deleteAudioBlob(s.id));
      revokeCachedUrl(audioUrlCache, s.id);
    }
    for(const task of t.writing.tasks){
      results.push(await deleteMediaBlob(task.id));
      revokeCachedUrl(mediaUrlCache, task.id);
    }
  }
  if(results.some(ok=>!ok)) showToast('Deleted, but some data only cleared from memory — storage unavailable');
}

function backToAdminHome(){
  flushAllPendingSaves();
  state.editingTestId = null;
  render();
}

function setAdminTab(tab){
  flushAllPendingSaves();
  state.adminTab = tab;
  render();
}

function renderTestEditor(test){
  const tabs = ['info','listening','reading','writing','speaking'].map(tab => `
    <button class="${state.adminTab===tab?'active':''}" onclick="setAdminTab('${tab}')">${tab[0].toUpperCase()+tab.slice(1)}</button>
  `).join('');

  let body = '';
  if(state.adminTab==='info') body = renderAdminInfoTab(test);
  else if(state.adminTab==='listening') body = renderAdminListeningTab(test);
  else if(state.adminTab==='reading') body = renderAdminReadingTab(test);
  else if(state.adminTab==='writing') body = renderAdminWritingTab(test);
  else body = renderAdminSpeakingTab(test);

  return `
    <h2 class="section-title">${escapeHtml(test.title || 'Untitled test')}</h2>
    <p class="section-sub">Editing this test. Changes save automatically as you add or remove items.</p>
    <div class="tab-bar">${tabs}</div>
    ${body}
    <div class="save-bar">
      <button class="btn btn-ghost" onclick="backToAdminHome()">← Back to all tests</button>
      <button class="btn btn-alert" onclick="deleteTest('${test.id}')">Delete test</button>
    </div>
  `;
}

function renderAdminInfoTab(test){
  return `
    <div class="card">
      <div class="field">
        <label>Test title</label>
        <input type="text" value="${escapeAttr(test.title)}" oninput="updateTestField('${test.id}','title', this.value)">
      </div>
      <div class="field">
        <label>Description</label>
        <input type="text" value="${escapeAttr(test.description)}" oninput="updateTestField('${test.id}','description', this.value)">
      </div>
    </div>
  `;
}

function updateTestField(tid, field, val){
  const t = getTest(tid);
  t[field] = val;
  const h2 = document.querySelector('.section-title');
  if(h2 && field==='title') h2.textContent = val || 'Untitled test';
  persistTestDebounced(t);
}

/* ============================================================
   Listening tab — sectioned (own audio + own questions each)
   ============================================================ */
function renderAdminListeningTab(test){
  const cards = test.listening.sections.map((sec) => renderListeningSectionCard(test, sec)).join('');
  return `${cards}<button class="btn" onclick="addListeningSection('${test.id}')">+ Add listening section</button>`;
}

function renderListeningSectionCard(test, sec){
  const cached = audioUrlCache[sec.id];
  if(cached === undefined){
    ensureAudioLoaded(sec.id, ()=>{ if(state.editingTestId === test.id && state.adminTab === 'listening') render(); });
  }
  const audioPreview = (cached && cached !== false) ? `<audio controls src="${cached}" style="margin-top:10px;"></audio>` : '';
  const locationKey = 'listening:'+sec.id;
  const qs = sec.questions.map((q,i)=>renderAdminQuestionCard(q, i, test.id, 'listening', sec.id)).join('');
  return `
    <div class="card" style="margin-bottom:22px;">
      <div class="section-card-head">
        <strong>Section ${sec.sectionNumber}</strong>
        <button class="btn btn-ghost btn-sm" onclick="removeListeningSection('${test.id}','${sec.id}')">Remove section</button>
      </div>
      <div class="field">
        <label>Audio description (shown to students)</label>
        <input type="text" value="${escapeAttr(sec.audioNote)}" oninput="updateListeningSectionField('${test.id}','${sec.id}','audioNote', this.value)">
      </div>
      <div class="field">
        <label>Instructions (shown above the questions, e.g. "Questions 1-5. Complete the notes below.")</label>
        <input type="text" value="${escapeAttr(sec.instructions)}" oninput="updateListeningSectionField('${test.id}','${sec.id}','instructions', this.value)">
      </div>
      <div class="field">
        <label>Audio file (saved on-device, persists after refresh)</label>
        <input type="file" accept="audio/*" onchange="uploadAudio('${sec.id}', this)">
        ${audioPreview}
      </div>
      ${qs}
      ${renderAddQuestionRow(test.id, 'listening', sec.id, locationKey)}
    </div>
  `;
}

function addListeningSection(tid){
  const t = getTest(tid);
  t.listening.sections.push({ id: uid(), sectionNumber: t.listening.sections.length+1, audioNote:'', instructions:'', questions:[] });
  persistTestNow(t);
  render();
}
async function removeListeningSection(tid, secId){
  if(!confirm('Remove this listening section and its audio?')) return;
  const t = getTest(tid);
  t.listening.sections = t.listening.sections.filter(s=>s.id!==secId).map((s,i)=>({ ...s, sectionNumber: i+1 }));
  render();
  const ok = await deleteAudioBlob(secId);
  revokeCachedUrl(audioUrlCache, secId);
  const saveOk = await saveTestRecord(t);
  if(!ok || !saveOk) showToast('Removed, but some data only cleared from memory — storage unavailable');
  else showToast('Saved');
}
function updateListeningSectionField(tid, secId, field, val){
  const t = getTest(tid);
  const s = t.listening.sections.find(s=>s.id===secId);
  s[field] = val;
  persistTestDebounced(t);
}

async function uploadAudio(ownerId, input){
  const file = input.files[0];
  if(!file) return;
  const ok = await saveAudioBlob(ownerId, file);
  revokeCachedUrl(audioUrlCache, ownerId);
  audioUrlCache[ownerId] = URL.createObjectURL(file);
  render();
  showToast(ok ? 'Audio saved' : 'Not saved — storage unavailable, working from memory only');
}

/* ============================================================
   Reading tab — markdown-lite editor with live preview
   ============================================================ */
function renderAdminReadingTab(test){
  const qs = test.reading.questions.map((q,i)=>renderAdminQuestionCard(q, i, test.id, 'reading', null)).join('');
  return `
    <div class="card" style="margin-bottom:18px;">
      <div class="field">
        <label>Reading passage</label>
        <div class="hint-text">Blank line = new paragraph · <code>## Heading</code> for a heading · <code>a) item</code> for a lettered list · <code>- item</code> for a bullet list.</div>
        <div class="md-editor-grid">
          <textarea id="passage-editor-${test.id}" oninput="updateReadingPassage('${test.id}', this.value)">${escapeHtml(test.reading.passage)}</textarea>
          <div class="md-preview" id="passage-preview-${test.id}">${renderMarkdownLite(test.reading.passage)}</div>
        </div>
      </div>
      <div class="field">
        <label>Instructions (shown above the questions)</label>
        <input type="text" value="${escapeAttr(test.reading.instructions)}" oninput="updateReadingField('${test.id}','instructions', this.value)">
      </div>
    </div>
    ${qs}
    ${renderAddQuestionRow(test.id, 'reading', null, 'reading:none')}
  `;
}
function updateReadingField(tid, field, val){
  const t = getTest(tid);
  t.reading[field] = val;
  persistTestDebounced(t);
}
function updateReadingPassage(tid, val){
  const t = getTest(tid);
  t.reading.passage = val;
  const preview = document.getElementById('passage-preview-'+tid);
  if(preview) preview.innerHTML = renderMarkdownLite(val);
  persistTestDebounced(t);
}

/* ============================================================
   Shared question card — used for listening (per section) and
   reading. locationId is a listening section id, or null for
   reading (which stores questions directly on the test).
   ============================================================ */
function getQuestionArray(tid, section, locationId){
  const t = getTest(tid);
  if(section === 'listening'){
    return t.listening.sections.find(s=>s.id===locationId).questions;
  }
  return t.reading.questions;
}

function renderAddQuestionRow(tid, section, locationId, locationKey){
  const defaultType = state.defaultQType[locationKey] || 'mcq';
  const options = Object.keys(QUESTION_TYPE_LABELS).map(t=>`<option value="${t}" ${t===defaultType?'selected':''}>${QUESTION_TYPE_LABELS[t]}</option>`).join('');
  return `
    <div class="type-select-row">
      <select onchange="setDefaultQType('${locationKey}', this.value)">${options}</select>
      <button class="btn btn-sm" onclick="addQuestion('${tid}','${section}',${locationId ? "'"+locationId+"'" : 'null'}, '${locationKey}')">+ Add question</button>
    </div>
  `;
}
function setDefaultQType(locationKey, type){
  state.defaultQType[locationKey] = type;
}

function renderAdminQuestionCard(q, i, tid, section, locationId){
  let typeFields = '';
  if(q.type === 'mcq'){
    typeFields = q.options.map((opt,oi)=>`
      <div class="opt-row">
        <input type="text" value="${escapeAttr(opt)}" oninput="updateOption('${tid}','${section}','${locationId}','${q.id}',${oi}, this.value)" placeholder="Option ${oi+1}">
        <label style="font-size:12.5px; display:flex; gap:4px; align-items:center;"><input type="radio" name="correct-${q.id}" ${q.correct===oi?'checked':''} onchange="setCorrectOption('${tid}','${section}','${locationId}','${q.id}',${oi})"> correct</label>
        <button class="btn btn-ghost btn-sm" onclick="removeOption('${tid}','${section}','${locationId}','${q.id}',${oi})">✕</button>
      </div>
    `).join('') + `<button class="btn btn-sm" onclick="addOption('${tid}','${section}','${locationId}','${q.id}')">+ option</button>`;
  } else if(q.type === 'multi_select'){
    typeFields = `<div class="hint-text">Check every option that should count as correct.</div>` + q.options.map((opt,oi)=>`
      <div class="opt-row">
        <input type="text" value="${escapeAttr(opt)}" oninput="updateOption('${tid}','${section}','${locationId}','${q.id}',${oi}, this.value)" placeholder="Option ${oi+1}">
        <label style="font-size:12.5px; display:flex; gap:4px; align-items:center;"><input type="checkbox" ${q.correct.includes(oi)?'checked':''} onchange="toggleCorrectMulti('${tid}','${section}','${locationId}','${q.id}',${oi}, this.checked)"> correct</label>
        <button class="btn btn-ghost btn-sm" onclick="removeOption('${tid}','${section}','${locationId}','${q.id}',${oi})">✕</button>
      </div>
    `).join('') + `<button class="btn btn-sm" onclick="addOption('${tid}','${section}','${locationId}','${q.id}')">+ option</button>`;
  } else if(q.type === 'fill_blank'){
    typeFields = `<div class="field" style="max-width:320px;"><label>Correct answer</label><input type="text" value="${escapeAttr(q.correct)}" oninput="updateQuestionField('${tid}','${section}','${locationId}','${q.id}','correct', this.value)"></div>`;
  } else if(q.type === 'tfng'){
    typeFields = `<div class="field" style="max-width:220px;"><label>Correct answer</label>
      <select onchange="updateQuestionField('${tid}','${section}','${locationId}','${q.id}','correct', this.value)">
        <option value="True" ${q.correct==='True'?'selected':''}>True</option>
        <option value="False" ${q.correct==='False'?'selected':''}>False</option>
        <option value="Not Given" ${q.correct==='Not Given'?'selected':''}>Not Given</option>
      </select></div>`;
  } else if(q.type === 'form_completion'){
    const blankRows = q.blanks.map((b,bi)=>`
      <div class="blank-row">
        <span class="blank-tag">Blank {${b.n}}</span>
        <input type="text" placeholder="Correct answer" value="${escapeAttr(b.correct)}" oninput="updateBlank('${tid}','${section}','${locationId}','${q.id}',${bi}, this.value)">
        <button class="btn btn-ghost btn-sm" onclick="removeBlank('${tid}','${section}','${locationId}','${q.id}',${bi})">✕</button>
      </div>
    `).join('');
    typeFields = `
      <div class="field">
        <label>Template (use {1}, {2}... in order — each line becomes one row)</label>
        <textarea style="min-height:90px; font-family:var(--sans); font-size:13.5px;" oninput="updateQuestionField('${tid}','${section}','${locationId}','${q.id}','template', this.value)">${escapeHtml(q.template)}</textarea>
      </div>
      <div class="hint-text">Blanks below must stay in the same order as {1}, {2}... in the template. Removing one shifts the numbers after it.</div>
      ${blankRows}
      <button class="btn btn-sm" onclick="addBlank('${tid}','${section}','${locationId}','${q.id}')">+ blank</button>
    `;
  }
  return `
    <div class="admin-q-card">
      <div class="admin-q-head">
        <span class="qtype-badge">${i+1} · ${QUESTION_TYPE_LABELS[q.type] || q.type}</span>
        <button class="btn btn-ghost btn-sm" onclick="removeQuestion('${tid}','${section}','${locationId}','${q.id}')">Remove</button>
      </div>
      <div class="field">
        <label>Question prompt / instructions</label>
        <input type="text" value="${escapeAttr(q.prompt)}" oninput="updateQuestionField('${tid}','${section}','${locationId}','${q.id}','prompt', this.value)">
      </div>
      ${typeFields}
    </div>
  `;
}

function addQuestion(tid, section, locationId, locationKey){
  const arr = getQuestionArray(tid, section, locationId);
  const type = state.defaultQType[locationKey] || 'mcq';
  const q = { id: uid(), type, prompt:'New question' };
  if(type==='mcq'){ q.options=['Option 1','Option 2','Option 3','Option 4']; q.correct=0; }
  else if(type==='fill_blank'){ q.correct=''; }
  else if(type==='tfng'){ q.correct='True'; }
  else if(type==='multi_select'){ q.options=['Option 1','Option 2','Option 3','Option 4']; q.correct=[]; q.prompt='Choose the correct options.'; }
  else if(type==='form_completion'){ q.template='Example: the meeting starts at {1} and is held in {2}.'; q.blanks=[{n:1,correct:''},{n:2,correct:''}]; q.prompt='Complete the notes below. Write NO MORE THAN TWO WORDS for each answer.'; }
  arr.push(q);
  persistTestNow(getTest(tid));
  render();
}

function removeQuestion(tid, section, locationId, qid){
  const arr = getQuestionArray(tid, section, locationId);
  const idx = arr.findIndex(q=>q.id===qid);
  if(idx>-1) arr.splice(idx,1);
  persistTestNow(getTest(tid));
  render();
}
function updateQuestionField(tid, section, locationId, qid, field, val){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q[field] = val;
  persistTestDebounced(getTest(tid));
}
function addOption(tid, section, locationId, qid){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.options.push('New option');
  persistTestNow(getTest(tid));
  render();
}
function removeOption(tid, section, locationId, qid, idx){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.options.splice(idx,1);
  if(q.type==='mcq' && q.correct >= q.options.length) q.correct = 0;
  if(q.type==='multi_select') q.correct = q.correct.filter(i=>i!==idx).map(i=>i>idx?i-1:i);
  persistTestNow(getTest(tid));
  render();
}
function updateOption(tid, section, locationId, qid, idx, val){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.options[idx] = val;
  persistTestDebounced(getTest(tid));
}
function setCorrectOption(tid, section, locationId, qid, idx){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.correct = idx;
  persistTestNow(getTest(tid));
}
function toggleCorrectMulti(tid, section, locationId, qid, idx, isChecked){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  if(isChecked){ if(!q.correct.includes(idx)) q.correct.push(idx); }
  else { q.correct = q.correct.filter(i=>i!==idx); }
  persistTestNow(getTest(tid));
}
function addBlank(tid, section, locationId, qid){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.blanks.push({ n: q.blanks.length+1, correct:'' });
  persistTestNow(getTest(tid));
  render();
}
function removeBlank(tid, section, locationId, qid, idx){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.blanks.splice(idx,1);
  q.blanks.forEach((b,i)=>b.n=i+1);
  persistTestNow(getTest(tid));
  render();
}
function updateBlank(tid, section, locationId, qid, idx, val){
  const arr = getQuestionArray(tid, section, locationId);
  const q = arr.find(q=>q.id===qid);
  q.blanks[idx].correct = val;
  persistTestDebounced(getTest(tid));
}

/* ============================================================
   Writing tab — instructions + optional chart/graph image
   ============================================================ */
function renderAdminWritingTab(test){
  const tasks = test.writing.tasks.map((task,i)=>renderWritingTaskCard(test, task)).join('');
  return `${tasks}<button class="btn" onclick="addTask('${test.id}')">+ Add writing task</button>`;
}

function renderWritingTaskCard(test, task){
  const cached = mediaUrlCache[task.id];
  if(cached === undefined){
    ensureMediaLoaded(task.id, ()=>{ if(state.editingTestId === test.id && state.adminTab === 'writing') render(); });
  }
  const imagePreview = (cached && cached !== false)
    ? `<div style="margin-top:8px;"><img src="${cached}" style="max-width:260px; border-radius:8px; border:1px solid var(--border); display:block;"><button class="btn btn-ghost btn-sm" onclick="removeTaskImage('${test.id}','${task.id}')">Remove image</button></div>`
    : '';
  return `
    <div class="admin-q-card">
      <div class="admin-q-head">
        <span class="qtype-badge">Task ${task.taskNumber}</span>
        <button class="btn btn-ghost btn-sm" onclick="removeTask('${test.id}','${task.id}')">Remove</button>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Task number</label>
          <input type="number" min="1" max="2" value="${task.taskNumber}" oninput="updateTaskField('${test.id}','${task.id}','taskNumber', Number(this.value))">
        </div>
        <div class="field">
          <label>Minimum words</label>
          <input type="number" min="0" value="${task.minWords}" oninput="updateTaskField('${test.id}','${task.id}','minWords', Number(this.value))">
        </div>
      </div>
      <div class="field">
        <label>Instructions (shown above the prompt, e.g. timing/word-count guidance)</label>
        <input type="text" value="${escapeAttr(task.instructions)}" oninput="updateTaskField('${test.id}','${task.id}','instructions', this.value)">
      </div>
      <div class="field">
        <label>Prompt</label>
        <textarea oninput="updateTaskField('${test.id}','${task.id}','prompt', this.value)">${escapeHtml(task.prompt)}</textarea>
      </div>
      <div class="field">
        <label>Chart / graph / illustration (optional — for Academic Task 1)</label>
        <input type="file" accept="image/*" onchange="uploadTaskImage('${task.id}', this)">
        ${imagePreview}
      </div>
    </div>
  `;
}

function addTask(tid){
  const t = getTest(tid);
  t.writing.tasks.push({ id: uid(), taskNumber: t.writing.tasks.length+1, instructions:'', prompt:'New writing prompt', minWords:150 });
  persistTestNow(t);
  render();
}
async function removeTask(tid, taskId){
  const t = getTest(tid);
  t.writing.tasks = t.writing.tasks.filter(x=>x.id!==taskId);
  render();
  const mediaOk = await deleteMediaBlob(taskId);
  revokeCachedUrl(mediaUrlCache, taskId);
  const saveOk = await saveTestRecord(t);
  if(!mediaOk || !saveOk) showToast('Removed, but some data only cleared from memory — storage unavailable');
  else showToast('Saved');
}
function updateTaskField(tid, taskId, field, val){
  const t = getTest(tid);
  const task = t.writing.tasks.find(x=>x.id===taskId);
  task[field] = val;
  persistTestDebounced(t);
}
async function uploadTaskImage(taskId, input){
  const file = input.files[0];
  if(!file) return;
  const ok = await saveMediaBlob(taskId, file);
  revokeCachedUrl(mediaUrlCache, taskId);
  mediaUrlCache[taskId] = URL.createObjectURL(file);
  render();
  showToast(ok ? 'Image saved' : 'Not saved — storage unavailable, working from memory only');
}
async function removeTaskImage(tid, taskId){
  const ok = await deleteMediaBlob(taskId);
  revokeCachedUrl(mediaUrlCache, taskId);
  render();
  showToast(ok ? 'Image removed' : 'Removed from view, but storage unavailable — it may still be there after reload');
}

/* ============================================================
   Speaking tab — instructions + per-question tips
   ============================================================ */
function renderAdminSpeakingTab(test){
  const parts = test.speaking.parts.map(part=>{
    const cues = part.questions.map((cue,ci)=>`
      <div class="admin-q-card" style="margin-bottom:10px;">
        <div class="cue-row">
          <input type="text" value="${escapeAttr(cue.text)}" oninput="updateCueText('${test.id}','${part.id}',${ci}, this.value)" placeholder="Cue question / bullet point">
          <button class="btn btn-ghost btn-sm" onclick="removeCue('${test.id}','${part.id}',${ci})">✕</button>
        </div>
        <div class="field" style="margin-top:8px; margin-bottom:0;">
          <label>Tip / advice for students (optional, shown as a "Show tip" reveal)</label>
          <input type="text" value="${escapeAttr(cue.tip)}" oninput="updateCueTip('${test.id}','${part.id}',${ci}, this.value)" placeholder="e.g. Keep this answer brief — 1-2 sentences.">
        </div>
      </div>
    `).join('');
    return `
      <div class="admin-q-card">
        <div class="admin-q-head">
          <span class="qtype-badge">Part ${part.partNumber}</span>
          <button class="btn btn-ghost btn-sm" onclick="removePart('${test.id}','${part.id}')">Remove</button>
        </div>
        <div class="field">
          <label>Part title / cue-card topic</label>
          <input type="text" value="${escapeAttr(part.title)}" oninput="updatePartField('${test.id}','${part.id}','title', this.value)">
        </div>
        <div class="field">
          <label>Instructions (e.g. "You have 1 minute to prepare...")</label>
          <input type="text" value="${escapeAttr(part.instructions)}" oninput="updatePartField('${test.id}','${part.id}','instructions', this.value)">
        </div>
        <div class="field">
          <label>Cue questions</label>
          ${cues}
          <button class="btn btn-sm" onclick="addCue('${test.id}','${part.id}')">+ line</button>
        </div>
      </div>
    `;
  }).join('');
  return `${parts}<button class="btn" onclick="addPart('${test.id}')">+ Add speaking part</button>`;
}

function addPart(tid){
  const t = getTest(tid);
  t.speaking.parts.push({ id: uid(), partNumber: t.speaking.parts.length+1, title:'New part', instructions:'', questions:[{id:uid(), text:'New cue question', tip:''}] });
  persistTestNow(t);
  render();
}
function removePart(tid, pid){
  const t = getTest(tid);
  t.speaking.parts = t.speaking.parts.filter(p=>p.id!==pid);
  persistTestNow(t);
  render();
}
function updatePartField(tid, pid, field, val){
  const t = getTest(tid);
  const p = t.speaking.parts.find(p=>p.id===pid);
  p[field] = val;
  persistTestDebounced(t);
}
function addCue(tid, pid){
  const t = getTest(tid);
  const p = t.speaking.parts.find(p=>p.id===pid);
  p.questions.push({ id: uid(), text:'New cue question', tip:'' });
  persistTestNow(t);
  render();
}
function removeCue(tid, pid, idx){
  const t = getTest(tid);
  const p = t.speaking.parts.find(p=>p.id===pid);
  p.questions.splice(idx,1);
  persistTestNow(t);
  render();
}
function updateCueText(tid, pid, idx, val){
  const t = getTest(tid);
  const p = t.speaking.parts.find(p=>p.id===pid);
  p.questions[idx].text = val;
  persistTestDebounced(t);
}
function updateCueTip(tid, pid, idx, val){
  const t = getTest(tid);
  const p = t.speaking.parts.find(p=>p.id===pid);
  p.questions[idx].tip = val;
  persistTestDebounced(t);
}

/* ============================================================
   Lessons — just a title + one uploaded PDF each, edited directly
   on the list (no separate editor page needed for two fields).
   ============================================================ */
function renderAdminLessonsHome(){
  const cards = state.lessons.map(l => renderLessonCard(l)).join('');
  return `
    <h2 class="section-title">Manage lessons</h2>
    <p class="section-sub">Upload existing PDF notes or guides for students to read at their own pace.</p>
    <div style="margin-bottom:18px;"><button class="btn btn-primary" onclick="newLesson()">+ New lesson</button></div>
    ${cards || '<div class="empty-state"><h3>No lessons yet</h3><p>Create your first one above.</p></div>'}
  `;
}

function renderLessonCard(lesson){
  const cached = mediaUrlCache[lesson.id];
  if(cached === undefined){
    ensureMediaLoaded(lesson.id, ()=>{ if(state.adminSection === 'lessons' && !state.editingTestId) render(); });
  }
  const hasPdf = cached && cached !== false;
  const pdfControl = hasPdf
    ? `<span class="hint-text" style="margin:0 10px 0 0;">${escapeHtml(lesson.fileName || 'PDF attached')}</span>
       <a href="${cached}" target="_blank" class="btn btn-sm">Preview</a>
       <label class="btn btn-sm" style="cursor:pointer;">Replace<input type="file" accept="application/pdf" style="display:none;" onchange="uploadLessonPdf('${lesson.id}', this)"></label>
       <button class="btn btn-ghost btn-sm" onclick="removeLessonPdf('${lesson.id}')">Remove PDF</button>`
    : `<label class="btn btn-sm btn-primary" style="cursor:pointer;">Upload PDF<input type="file" accept="application/pdf" style="display:none;" onchange="uploadLessonPdf('${lesson.id}', this)"></label>`;
  return `
    <div class="card" style="margin-bottom:14px;">
      <div class="field" style="margin-bottom:12px;">
        <input type="text" value="${escapeAttr(lesson.title)}" oninput="updateLessonTitle('${lesson.id}', this.value)" placeholder="Lesson title" style="font-family:var(--serif); font-size:16px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; width:100%;">
      </div>
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
        ${pdfControl}
        <button class="btn btn-ghost btn-sm btn-alert" style="margin-left:auto;" onclick="deleteLesson('${lesson.id}')">Delete lesson</button>
      </div>
    </div>
  `;
}

function newLesson(){
  const l = { id: uid(), title: 'Untitled lesson', fileName: '' };
  state.lessons.push(l);
  persistLessonNow(l);
  render();
}
async function deleteLesson(id){
  if(!confirm('Delete this lesson? This cannot be undone.')) return;
  state.lessons = state.lessons.filter(l=>l.id!==id);
  render();
  const recordOk = await deleteLessonRecord(id);
  const mediaOk = await deleteMediaBlob(id);
  revokeCachedUrl(mediaUrlCache, id);
  if(!recordOk || !mediaOk) showToast('Deleted, but some data only cleared from memory — storage unavailable');
}
function updateLessonTitle(lid, val){
  const l = getLesson(lid);
  l.title = val;
  persistLessonDebounced(l);
}
async function uploadLessonPdf(lid, input){
  const file = input.files[0];
  if(!file) return;
  const l = getLesson(lid);
  const mediaOk = await saveMediaBlob(lid, file);
  revokeCachedUrl(mediaUrlCache, lid);
  mediaUrlCache[lid] = URL.createObjectURL(file);
  l.fileName = file.name;
  const saveOk = await saveLessonRecord(l);
  render();
  showToast((mediaOk && saveOk) ? 'PDF saved' : 'Not saved — storage unavailable, working from memory only');
}
async function removeLessonPdf(lid){
  const l = getLesson(lid);
  const ok = await deleteMediaBlob(lid);
  revokeCachedUrl(mediaUrlCache, lid);
  l.fileName = '';
  const saveOk = await saveLessonRecord(l);
  render();
  showToast((ok && saveOk) ? 'PDF removed' : 'Removed from view, but storage unavailable — it may still be there after reload');
}

init();
</script>
